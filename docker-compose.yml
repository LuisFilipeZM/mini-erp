services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: minierp
      POSTGRES_USER: minierp
      POSTGRES_PASSWORD: minierp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minierp -d minierp"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    profiles: ["full"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=minierp;Username=minierp;Password=minierp
      Cors__Origins__0: http://localhost:3000
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5080
    profiles: ["full"]
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
